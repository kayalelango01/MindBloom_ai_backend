<!DOCTYPE html>
<html>
<head>
    <title>Simple Connection Test</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        .result { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔌 Backend Connection Test</h1>
    
    <button onclick="testConnection()">Test Backend Connection</button>
    
    <div id="result"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Testing connection...</p>';
            
            try {
                // Test 1: Can we reach the backend?
                const response = await fetch('http://localhost:8000/api/csrf/', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h3>✅ SUCCESS! Backend is connected!</h3>
                        <p><strong>Status:</strong> ${response.status} OK</p>
                        <p><strong>Response:</strong> ${JSON.stringify(data)}</p>
                        <p><strong>Cookies set:</strong> ${document.cookie ? 'Yes ✅' : 'No ❌'}</p>
                        <hr>
                        <p>🎉 Now you can open <code>test-api.html</code> and it should work!</p>
                    `;
                } else {
                    throw new Error(`Server responded with status: ${response.status}`);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>❌ Connection Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <hr>
                    <p><strong>Troubleshooting:</strong></p>
                    <ol>
                        <li>Make sure Django server is running (you should see "Starting development server" in terminal)</li>
                        <li>Check that the server is on http://localhost:8000</li>
                        <li>Try refreshing this page and clicking the button again</li>
                        <li>Check browser console (F12) for more details</li>
                    </ol>
                    <p><strong>Django should show:</strong> "Starting development server at http://127.0.0.1:8000/"</p>
                `;
            }
        }

        // Auto-test on page load
        window.onload = () => {
            setTimeout(testConnection, 500);
        };
    </script>
</body>
</html>
